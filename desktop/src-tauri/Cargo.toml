[package]
name = "codeisland-desktop"
version = "0.1.0"
description = "CodeIsland desktop status island"
authors = ["CodeIsland contributors"]
edition = "2024"

[lib]
name = "codeisland_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

codeisland-domain = { path = "crates/codeisland-domain" }
codeisland-ipc = { path = "crates/codeisland-ipc" }
codeisland-runtime = { path = "crates/codeisland-runtime" }
codeisland-agents = { path = "crates/codeisland-agents" }
codeisland-integrations = { path = "crates/codeisland-integrations", features = ["ble", "ssh"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Radios",
  "Foundation",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_LibraryLoader",
  "Win32_System_WinRT",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_SystemInformation",
] }

[workspace]
members = ["crates/*"]
resolver = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
