# CodeIsland agent hook definitions.
#
# Paths are relative to %USERPROFILE% unless they are absolute. The first
# existing path wins; the first entry is used when none exists.
#
# format:   claude_json | event_map_json | cursor_json | copilot_json |
#           opencode_plugin | generic_json | toml_block | yaml_block |
#           plugin_js | manual
# response: claude | codex | gemini | cursor | notification | plain
# Hook names and timeouts come from the original ConfigInstaller.

# ── Claude Code ──────────────────────────────────────────────────────────────
[[agents]]
id = "claude"
display = "Claude Code"
source = "claude"
executables = ["claude"]
config = [".claude/settings.json"]
format = "claude_json"
response = "claude"
icon = "claude"
docs = "https://docs.anthropic.com/en/docs/claude-code/hooks"

# ── Codex ────────────────────────────────────────────────────────────────────
[[agents]]
id = "codex"
display = "Codex"
source = "codex"
executables = ["codex"]
config = [".codex/hooks.json"]
format = "event_map_json"
response = "codex"
icon = "codex"
docs = "https://developers.openai.com/codex/hooks"

