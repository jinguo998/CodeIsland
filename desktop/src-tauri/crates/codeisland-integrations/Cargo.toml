[package]
name = "codeisland-integrations"
version = "0.1.0"
edition = "2024"
description = "Push notifications, BLE Buddy, remote SSH and LAN sync"

[dependencies]
codeisland-swift = { path = "../codeisland-swift" }
base64 = "0.22"
percent-encoding = "2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
unicode-segmentation = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
codeisland-domain = { path = "../codeisland-domain" }
thiserror = "2"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
default = []
ble = ["dep:btleplug", "dep:futures-util"]
ssh = ["dep:russh", "dep:russh-sftp"]
lan = ["dep:axum", "dep:tower-http"]

[dependencies.btleplug]
version = "0.13"
optional = true

# btleplug's notification API returns a futures Stream; consuming it needs
# StreamExt. Feature-gated with `ble` so default builds stay dependency-free.
[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.russh]
version = "0.65"
optional = true
# aws-lc-rs needs NASM on Windows; ring builds with the stock MSVC toolchain.
default-features = false
features = ["ring", "flate2", "rsa"]

[dependencies.russh-sftp]
version = "2"
optional = true

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.tower-http]
version = "0.6"
optional = true
features = ["cors", "trace"]
