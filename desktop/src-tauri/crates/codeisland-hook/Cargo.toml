[package]
name = "codeisland-hook"
version = "0.1.0"
edition = "2024"
description = "Tiny one-shot hook client for CodeIsland"

[[bin]]
name = "codeisland-hook"
path = "src/main.rs"

[dependencies]
codeisland-domain = { path = "../codeisland-domain" }
codeisland-ipc = { path = "../codeisland-ipc" }
codeisland-agents = { path = "../codeisland-agents" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
codeisland-runtime = { path = "../codeisland-runtime" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
