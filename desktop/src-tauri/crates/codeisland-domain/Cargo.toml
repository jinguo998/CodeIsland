[package]
name = "codeisland-domain"
version = "0.1.0"
edition = "2024"
description = "Cross-platform CodeIsland domain model and session reducer"

[dependencies]
codeisland-swift = { path = "../codeisland-swift" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "serde-json-impl", "serde-compat"] }
thiserror = "2"
