[package]
name = "codeisland-cli"
version = "0.1.0"
edition = "2024"
description = "CodeIsland hook installer, doctor and diagnostics CLI"

[[bin]]
name = "codeisland"
path = "src/main.rs"

[dependencies]
codeisland-domain = { path = "../codeisland-domain" }
codeisland-agents = { path = "../codeisland-agents" }
codeisland-runtime = { path = "../codeisland-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
